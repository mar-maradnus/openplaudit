[build-system]
requires = ["setuptools>=68.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "plaude"
version = "0.1.0"
description = "Local-first CLI for PLAUD Note AI recorder — BLE sync, Opus decode, Whisper transcription"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Ram Sundaram", email = "ram@terrapay.com"}]
dependencies = [
    "bleak>=0.22",
    "opuslib>=3.0",
    "click>=8.0",
    "tomli-w>=1.0",
    # RSA/PKCS#1 unwrap and ChaCha20: the E2EE download path and device
    # re-binding both need it at runtime, not just in tests.
    "cryptography>=41.0",
]

[project.optional-dependencies]
# Local transcription. Without it `plaude sync` still downloads and decodes;
# set transcription.api_key (or OPENAI_API_KEY) to use an OpenAI-compatible
# endpoint instead.
whisper = ["openai-whisper"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]
research = [
    "httpx>=0.27",
    "websockets>=13.0",
]

[project.scripts]
plaude = "plaude.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
